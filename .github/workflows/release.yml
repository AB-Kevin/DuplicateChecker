# Builds the Windows installer and publishes it as a GitHub release whenever a
# version tag is pushed. Create one with `npm version patch` (or minor/major)
# and push it with `git push` (push.followTags) or `git push --follow-tags`.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: Build the installer
        run: npm run dist

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer="dist/DuplicateChecker-Setup-${GITHUB_REF_NAME#v}.exe"
          # Re-running this job replaces the installer on the existing release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$installer" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$installer" --title "Duplicate Checker $GITHUB_REF_NAME" --generate-notes
          fi
